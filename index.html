<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WGSL — Fancy Hello World</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #03030a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #error {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            box-sizing: border-box;
            color: #ffd7d7;
            background: #10080c;
            font: 16px/1.6 system-ui, sans-serif;
            white-space: pre-wrap;
            text-align: center;
        }

        #error[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="gpu" aria-label="Animated WGSL neon aurora"></canvas>
    <div id="error" role="alert" hidden></div>

    <script type="module">
        const canvas = document.querySelector("#gpu");
        const errorBox = document.querySelector("#error");

        function fail(error) {
            console.error(error);
            errorBox.textContent =
                error instanceof Error ? error.message : String(error);
            errorBox.hidden = false;
        }

        async function main() {
            if (!navigator.gpu) {
                throw new Error(
                    "WebGPU is unavailable.\n\n" +
                    "Use a current WebGPU-capable browser and serve this page " +
                    "over HTTPS or localhost."
                );
            }

            const adapter = await navigator.gpu.requestAdapter({
                powerPreference: "high-performance"
            });

            if (!adapter) {
                throw new Error("No suitable WebGPU adapter was found.");
            }

            const device = await adapter.requestDevice();
            const context = canvas.getContext("webgpu");

            if (!context) {
                throw new Error("Could not create a WebGPU canvas context.");
            }

            const format = navigator.gpu.getPreferredCanvasFormat();

            context.configure({
                device,
                format,
                alphaMode: "opaque"
            });

            const shader = device.createShaderModule({
                label: "Neon aurora shader",
                code: /* wgsl */ `
          struct Uniforms {
              resolution: vec2f,
              time: f32,
              _padding: f32,
          };

          @group(0) @binding(0)
          var<uniform> uniforms: Uniforms;

          // One oversized triangle covers the entire screen.
          @vertex
          fn vs_main(
              @builtin(vertex_index) index: u32
          ) -> @builtin(position) vec4f {
              var positions = array<vec2f, 3>(
                  vec2f(-1.0, -1.0),
                  vec2f( 3.0, -1.0),
                  vec2f(-1.0,  3.0)
              );

              return vec4f(positions[index], 0.0, 1.0);
          }

          fn hash21(p: vec2f) -> f32 {
              var q = fract(vec3f(p.x, p.y, p.x) * 0.1031);
              q += vec3f(dot(q, q.yzx + vec3f(33.33)));
              return fract((q.x + q.y) * q.z);
          }

          fn noise(p: vec2f) -> f32 {
              let i = floor(p);
              let f = fract(p);
              let u = f * f * (vec2f(3.0) - f * 2.0);

              let a = hash21(i);
              let b = hash21(i + vec2f(1.0, 0.0));
              let c = hash21(i + vec2f(0.0, 1.0));
              let d = hash21(i + vec2f(1.0, 1.0));

              return mix(
                  mix(a, b, u.x),
                  mix(c, d, u.x),
                  u.y
              );
          }

          fn fbm(start: vec2f) -> f32 {
              var p = start;
              var value = 0.0;
              var amplitude = 0.5;
              let rotation = mat2x2f(
                  0.8, -0.6,
                  0.6,  0.8
              );

              for (var i = 0; i < 4; i += 1) {
                  value += amplitude * noise(p);
                  p = rotation * p * 2.03 + vec2f(17.1, 9.2);
                  amplitude *= 0.5;
              }

              return value;
          }

          fn palette(t: f32) -> vec3f {
              let phase = vec3f(0.0, 0.33, 0.67);
              return vec3f(0.5)
                  + cos(6.2831853 * (vec3f(t) + phase)) * 0.5;
          }

          @fragment
          fn fs_main(
              @builtin(position) frag: vec4f
          ) -> @location(0) vec4f {
              let time = uniforms.time;

              // Centered, aspect-correct coordinates.
              var uv = (frag.xy * 2.0 - uniforms.resolution)
                  / min(
                      uniforms.resolution.x,
                      uniforms.resolution.y
                  );

              uv.y = -uv.y;

              let t = time * 0.12;
              let radius = length(uv);

              // Warp the noise domain with two more layers of noise.
              let warp = vec2f(
                  fbm(uv * 1.2 + vec2f(t, -t)),
                  fbm(
                      uv * 1.2
                      + vec2f(5.2 - t * 0.7, 1.3 + t * 0.4)
                  )
              );

              let n = fbm(
                  uv * 1.6
                  + warp * 2.2
                  + vec2f(-t * 0.3, t * 0.2)
              );

              let ribbons = max(
                  0.0,
                  0.5 + 0.5 * sin(
                      n * 14.0 - radius * 4.0 + time * 0.7
                  )
              );

              var color = palette(
                  n + warp.x * 0.25 + time * 0.025
              );

              color *= 0.12 + 1.65 * pow(ribbons, 3.0);

              let halo = pow(
                  max(0.0, 1.0 - abs(n - 0.52) * 5.0),
                  4.0
              );

              color += vec3f(0.1, 0.35, 1.0) * halo * 0.35;

              let vignette =
                  1.0 - smoothstep(0.4, 1.5, radius);

              color *= 0.3 + 0.7 * vignette;

              // Glow, tone mapping, and a gentle brightness lift.
              color = vec3f(1.0) - exp(-color * 1.4);
              color = pow(color, vec3f(0.85));

              return vec4f(color, 1.0);
          }
        `
            });

            // Surface WGSL compilation errors in the page.
            const compilationInfo = await shader.getCompilationInfo();
            const shaderErrors = compilationInfo.messages.filter(
                message => message.type === "error"
            );

            if (shaderErrors.length > 0) {
                throw new Error(
                    shaderErrors.map(error =>
                        `WGSL ${error.lineNum}:${error.linePos}\n${error.message}`
                    ).join("\n\n")
                );
            }

            const pipeline = await device.createRenderPipelineAsync({
                label: "Neon aurora pipeline",
                layout: "auto",

                vertex: {
                    module: shader,
                    entryPoint: "vs_main"
                },

                fragment: {
                    module: shader,
                    entryPoint: "fs_main",
                    targets: [{ format }]
                },

                primitive: {
                    topology: "triangle-list"
                }
            });

            // vec2f resolution + f32 time + f32 padding = 16 bytes.
            const uniformBuffer = device.createBuffer({
                label: "Frame uniforms",
                size: 16,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
            });

            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [
                    {
                        binding: 0,
                        resource: { buffer: uniformBuffer }
                    }
                ]
            });

            const uniforms = new Float32Array(4);
            const startedAt = performance.now();
            let stopped = false;

            device.lost.then(info => {
                stopped = true;
                fail(new Error(`GPU device lost: ${info.message}`));
            });

            function resizeCanvas() {
                // Capping DPR keeps the procedural shader affordable on 4K/retina screens.
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                const maxSize = device.limits.maxTextureDimension2D;

                const width = Math.min(
                    maxSize,
                    Math.max(1, Math.floor(canvas.clientWidth * dpr))
                );

                const height = Math.min(
                    maxSize,
                    Math.max(1, Math.floor(canvas.clientHeight * dpr))
                );

                if (canvas.width !== width || canvas.height !== height) {
                    canvas.width = width;
                    canvas.height = height;
                }
            }

            function frame(now) {
                if (stopped) return;

                resizeCanvas();

                uniforms[0] = canvas.width;
                uniforms[1] = canvas.height;
                uniforms[2] = (now - startedAt) / 1000;
                uniforms[3] = 0;

                device.queue.writeBuffer(uniformBuffer, 0, uniforms);

                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: "clear",
                            storeOp: "store"
                        }
                    ]
                });

                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.draw(3);
                pass.end();

                device.queue.submit([encoder.finish()]);
                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        }

        main().catch(fail);
    </script>
</body>

</html>
